<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-50 shadow-sm flex-shrink-0">
    <div class="p-4 h-16 text-lg font-semibold text-gray-800 border-b border-gray-100">
      Inventory System
    </div>
    <nav class="p-4 space-y-1">
      @for (item of visibleMenuItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-gray-200 font-medium"
        class="block px-3 py-2 rounded text-gray-700 hover:bg-gray-200 transition"
      >
        {{ item.label }}
      </a>
      }
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col bg-white overflow-hidden">
    <header
      class="h-16 flex items-center justify-between px-6 border-b border-gray-100 bg-gray-50 shadow"
    >
      <h1 class="text-lg font-semibold text-gray-800">{{ pageTitle() }}</h1>
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-600">
          {{ currentRole() }}
        </span>

        <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" (click)="logout()">
          Logout
        </button>
      </div>
    </header>
    <section class="flex-1 p-6 overflow-y-auto bg-gray-100">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
