<app-loader
  [loading]="loading"
  [message]="isEdit() ? 'Updating user...' : 'Saving user...'"
></app-loader>
<div class="flex items-center justify-between mb-4">
  <h2 class="text-lg font-semibold mb-4">{{ isEdit() ? 'Edit User' : 'Add User' }}</h2>
  <button (click)="goBack()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    Back
  </button>
</div>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 p-4 bg-white shadow rounded">
  <div>
    <label class="block mb-1 font-semibold">Name</label>
    <input formControlName="name" type="text" class="border p-2 w-full rounded" />
  </div>

  <div>
    <label class="block mb-1 font-semibold">Email</label>
    <input formControlName="email" type="email" class="border p-2 w-full rounded" />
  </div>

  <div>
    <label class="block mb-1 font-semibold">Role</label>
    <select formControlName="role" class="border p-2 w-full rounded">
      <option value="">Select Role</option>
      @for (role of roles; track $index) {
      <option [value]="role">{{ role }}</option>
      }
    </select>
  </div>

  <div class="flex space-x-2 mt-4">
    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
      {{ isEdit() ? 'Update' : 'Save' }}
    </button>
    <button
      type="button"
      (click)="onCancel()"
      class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
    >
      Cancel
    </button>
  </div>
</form>
