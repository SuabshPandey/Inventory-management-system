<app-loader [loading]="loading" message="Saving item..."></app-loader>
<div class="flex items-center justify-between mb-4">
  <h2 class="text-lg font-semibold mb-4">{{ isEditMode() ? 'Edit Item' : 'Add Item' }}</h2>
  <button (click)="goBack()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    Back
  </button>
</div>
<div class="bg-white shadow rounded p-6">
  <h2 class="text-lg font-semibold mb-4">
    {{ isEditMode() ? 'Edit Item' : 'Add Item' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 p-4">
    <div>
      <label class="block mb-1 font-medium">Name</label>
      <input formControlName="name" type="text" class="border p-2 w-full rounded" />
    </div>

    <div>
      <label class="block mb-1 font-medium">SKU</label>
      <input formControlName="sku" type="text" class="border p-2 w-full rounded" />
    </div>

    <div>
      <label class="block mb-1 font-medium">Price</label>
      <input formControlName="price" type="number" class="border p-2 w-full rounded" />
    </div>

    <div>
      <label class="block mb-1 font-medium">Stock</label>
      <input formControlName="stock" type="number" class="border p-2 w-full rounded" />
    </div>

    <div class="flex gap-2 pt-4">
      <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
        Save
      </button>
      <button
        type="button"
        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
