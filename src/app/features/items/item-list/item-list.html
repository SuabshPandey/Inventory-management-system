<app-loader [loading]="loading" message="Loading items..."></app-loader>

<div class="bg-white shadow rounded p-4">
  <div class="flex justify-between items-center mb-4 gap-4">
    <h2 class="text-lg font-semibold">Items</h2>
    <input
      type="text"
      placeholder="Search by name or SKU"
      class="border px-3 py-2 rounded w-64"
      (input)="searchTerm.set($any($event.target).value)"
    />

    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" (click)="addItem()">
      Add Item
    </button>
  </div>
  @if (!loading()) {
  <app-table [columns]="columns" [data]="filteredItems()" [actions]="actions"></app-table>
  }
</div>
