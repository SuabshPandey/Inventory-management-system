<app-loader [loading]="loading" message="Processing role..."></app-loader>

<div class="max-w-md mx-auto bg-white shadow rounded p-6">
  <h2 class="text-lg font-semibold mb-4">@if (roleId !== null) { Edit Role } @else { Add Role }</h2>

  @if (error()) {
  <div class="mb-3 text-red-600 text-sm">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Role Name -->
    <div>
      <label class="block text-sm font-medium mb-1">Role Name</label>
      <input
        type="text"
        formControlName="name"
        class="border rounded w-full p-2"
        placeholder="Enter role name"
      />
    </div>

    <!-- Actions -->
    <div class="flex gap-2 pt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        @if (roleId !== null) { Update } @else { Add }
      </button>

      <button
        type="button"
        (click)="onCancel()"
        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
